<!DOCTYPE html>
<html>
<head>
    <title>Мой первый сайт</title>
    <style>
        /* Это CSS - стили для нашего сайта */
        body {
            background-color: #1a1a1a; /* Темный фон */
            color: white; /* Белый текст */
            font-family: Arial, sans-serif; /* Современный шрифт */
            text-align: center; /* Выравнивание по центру */
            padding-top: 100px; /* Отступ сверху */
        }

        h1 {
            color: #4CAF50; /* Зеленый цвет для заголовка (как у Python) */
            font-size: 48px; /* Размер шрифта */
        }

        p {
            font-size: 20px;
            color: #cccccc; /* Светло-серый текст */
        }

        button {
            background-color: #4CAF50; /* Зеленая кнопка */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px; /* Закругленные углы */
            cursor: pointer; /* Курсор в виде руки при наведении */
            margin-top: 20px;
        }

            button:hover {
                background-color: #45a049;
                transform: scale(1.05); /* Кнопка чуть увеличивается */
                transition: 0.3s; /* Плавная анимация */
            }

        /* Адаптивность для телефонов */
        @media (max-width: 600px) {
            h1 {
                font-size: 32px; /* Уменьшаем заголовок на телефоне */
            }

            p {
                font-size: 16px;
            }

            body {
                padding-top: 50px; /* Уменьшаем отступ сверху */
            }

            img {
                width: 120px !important; /* Делаем картинку чуть меньше */
            }
        }
    </style>
</head>
<body>
    <img src="avatar.jfif" alt="Моя аватарка" width="150" style="border-radius: 50%;">
    <h1>Привет, я Кирилл!</h1>

    </div>

</html>
